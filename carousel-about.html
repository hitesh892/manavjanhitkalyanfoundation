<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work On Ground — MJKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="carousel-about.css">
    <script src="carousel-about.js"></script>
</head>
<body>
  <section class="mjks-ground" aria-labelledby="mjks-ground-title">
    <div class="mjks-ground__inner">
      <header class="mjks-ground__header">
        <div>
          <p class="mjks-ground__eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5c0 5-8 10-8 10s-8-5-8-10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="11.5" r="2.5"/></svg><span>Work On Ground</span></p>
          <h1 class="mjks-ground__title" id="mjks-ground-title">Real People. <span>Real Change.</span></h1>
        </div>
        <p class="mjks-ground__description">From nutritious meals and healthcare support to education, elderly care, ambulance services and community outreach, we work every day to bring dignity and hope to those who need it most.</p>
      </header>

      <div class="mjks-ground__viewport" data-carousel>
        <button class="mjks-ground__arrow mjks-ground__arrow--prev" type="button" aria-label="Previous work stories" data-prev><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <ul class="mjks-ground__track" data-track>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/meal-distribution.png" alt="Volunteer serving a nutritious meal to community elders" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Meal Distribution</figcaption></figure></li>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/healthcare-support.png" alt="Doctor providing a health check to a rural woman" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Healthcare Support</figcaption></figure></li>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/elderly-care.png" alt="Care team supporting an elderly man at home" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Elderly Care</figcaption></figure></li>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/education-support.png" alt="Teacher helping children learn in a community classroom" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Education Support</figcaption></figure></li>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/ambulance-service.png" alt="Emergency team bringing an ambulance to a rural family" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Ambulance Service</figcaption></figure></li>
          <li class="mjks-ground__item"><figure class="mjks-ground__figure"><span class="mjks-ground__media"><img src="assets/community-outreach.png" alt="Community worker listening with a family in their home" loading="lazy" width="1536" height="1024"></span><figcaption class="mjks-ground__label">Community Outreach</figcaption></figure></li>
        </ul>
        <button class="mjks-ground__arrow mjks-ground__arrow--next" type="button" aria-label="Next work stories" data-next><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
  </section>
</body>
</html>

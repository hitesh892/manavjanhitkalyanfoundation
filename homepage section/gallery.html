<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F9FCF6">
  <title>Video Gallery — Manav Janhit Kalyan Sansthan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <main>
    <section class="video-gallery" aria-labelledby="video-title">
      <div class="gallery-inner">
        <div class="gallery-intro">
          <p class="eyebrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
            Video Gallery
          </p>
          <h2 id="video-title">Stories<br>In <span>Motion.</span></h2>
          <p class="intro-copy">Watch real stories from our work on the ground and see the impact of your support.</p>
          <a class="explore-link" href="#video-gallery-items">
            Explore Videos
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>

        <div class="carousel" id="video-gallery-items" aria-label="Featured foundation videos">
          <button class="arrow arrow-prev" type="button" aria-label="Previous video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="track" aria-live="polite">
            <article class="video-card video-meals" aria-label="Video placeholder: Community meals">
              <div class="poster" role="img" aria-label="Placeholder poster for a community meal video">
                <span class="placeholder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.7.8-1.1 1.4-.7l9.2 6.2a.9.9 0 0 1 0 1.4l-9.2 6.2c-.6.4-1.4 0-1.4-.7V5.8Z"/></svg></span>
                <span class="placeholder-label">Video placeholder</span>
              </div><span class="duration">02:18</span>
            </article>
            <article class="video-card video-healthcare" aria-label="Video placeholder: Healthcare support">
              <div class="poster" role="img" aria-label="Placeholder poster for a healthcare support video">
                <span class="placeholder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.7.8-1.1 1.4-.7l9.2 6.2a.9.9 0 0 1 0 1.4l-9.2 6.2c-.6.4-1.4 0-1.4-.7V5.8Z"/></svg></span>
                <span class="placeholder-label">Video placeholder</span>
              </div><span class="duration">01:46</span>
            </article>
            <article class="video-card video-elder-story is-featured" aria-label="Featured video placeholder: Bringing Hope Through Community Support">
              <div class="poster" role="img" aria-label="Placeholder poster for Bringing Hope Through Community Support">
                <span class="placeholder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.7.8-1.1 1.4-.7l9.2 6.2a.9.9 0 0 1 0 1.4l-9.2 6.2c-.6.4-1.4 0-1.4-.7V5.8Z"/></svg></span>
                <span class="placeholder-label">Bringing Hope Through<br>Community Support</span>
              </div><span class="duration">03:24</span>
            </article>
            <article class="video-card video-ambulance" aria-label="Video placeholder: Ambulance service">
              <div class="poster" role="img" aria-label="Placeholder poster for an ambulance service video">
                <span class="placeholder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.7.8-1.1 1.4-.7l9.2 6.2a.9.9 0 0 1 0 1.4l-9.2 6.2c-.6.4-1.4 0-1.4-.7V5.8Z"/></svg></span>
                <span class="placeholder-label">Video placeholder</span>
              </div><span class="duration">02:05</span>
            </article>
            <article class="video-card video-outreach" aria-label="Video placeholder: Community outreach">
              <div class="poster" role="img" aria-label="Placeholder poster for a community outreach video">
                <span class="placeholder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.8c0-.7.8-1.1 1.4-.7l9.2 6.2a.9.9 0 0 1 0 1.4l-9.2 6.2c-.6.4-1.4 0-1.4-.7V5.8Z"/></svg></span>
                <span class="placeholder-label">Video placeholder</span>
              </div><span class="duration">01:58</span>
            </article>
          </div>
          <button class="arrow arrow-next" type="button" aria-label="Next video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <div class="dots" role="group" aria-label="Choose featured video">
            <button class="dot" type="button" aria-label="Show video 1" aria-current="false"></button>
            <button class="dot" type="button" aria-label="Show video 2" aria-current="false"></button>
            <button class="dot" type="button" aria-label="Show video 3" aria-current="true"></button>
            <button class="dot" type="button" aria-label="Show video 4" aria-current="false"></button>
            <button class="dot" type="button" aria-label="Show video 5" aria-current="false"></button>
          </div>
          <p class="sr-only" id="carousel-status" aria-live="polite">Video 3 of 5 featured.</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const track = document.querySelector('.track');
      const cards = [...track.children];
      const dots = [...document.querySelectorAll('.dot')];
      const status = document.querySelector('#carousel-status');
      let active = 2;

      function show(index) {
        active = (index + cards.length) % cards.length;
        const ordered = cards.map((_, offset) => cards[(active - 2 + offset + cards.length) % cards.length]);
      ordered.forEach((card, position) => {
        track.append(card);
        card.classList.toggle('is-featured', position === 2);
        card.dataset.slot = String(position);
        card.setAttribute('aria-hidden', window.matchMedia('(max-width: 767px)').matches && (position === 0 || position === 4) ? 'true' : 'false');
        });
        dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === active)));
        status.textContent = `Video ${active + 1} of ${cards.length} featured.`;
      }
      document.querySelector('.arrow-prev').addEventListener('click', () => show(active - 1));
      document.querySelector('.arrow-next').addEventListener('click', () => show(active + 1));
      dots.forEach((dot, i) => dot.addEventListener('click', () => show(i)));
      window.addEventListener('resize', () => show(active));
      show(active);
    })();
  </script>
</body>
</html>

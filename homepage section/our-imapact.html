<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#284034">
  <title>Our Impact — Manav Janhit Kalyan Sansthan</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="our-impact.css">
</head>
<body>
 <section class="impact-section" aria-labelledby="impact-title">
  <div class="impact-inner">
    <div class="impact-copy">
      <p class="impact-eyebrow">Our Impact</p>
      <h2 class="impact-heading" id="impact-title">People. Care. Progress.</h2>
      <p class="impact-description">
        Together, we are creating lasting change through health, education,
        nutrition and community support.
      </p>
    </div>

    <div class="impact-stats" aria-label="Our impact statistics">
      <article class="impact-stat" data-impact-stat>
        <span class="impact-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M27.2 11.6c0 7.2-11.2 15.1-11.2 15.1S4.8 18.8 4.8 11.6a6 6 0 0 1 11.2-2.9 6 6 0 0 1 11.2 2.9Z" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="impact-number" data-count="12500">12,500+</span>
        <span class="impact-label">Meals Provided</span>
      </article>

      <article class="impact-stat" data-impact-stat>
        <span class="impact-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="9" r="4" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="7" cy="12" r="3" stroke="currentColor" stroke-width="2.2"/>
            <circle cx="25" cy="12" r="3" stroke="currentColor" stroke-width="2.2"/>
            <path d="M8 25v-3.2a8 8 0 0 1 16 0V25M2.8 24v-2.1a5 5 0 0 1 6.1-4.9M29.2 24v-2.1a5 5 0 0 0-6.1-4.9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="impact-number" data-count="8200">8,200+</span>
        <span class="impact-label">Lives Touched</span>
      </article>

      <article class="impact-stat" data-impact-stat>
        <span class="impact-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 26c-3.1-2-6.7-2.7-11-2.2V6.5c4.3-.5 7.9.2 11 2.2m0 17.3c3.1-2 6.7-2.7 11-2.2V6.5c-4.3-.5-7.9.2-11 2.2m0 17.3V8.7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="impact-number" data-count="3100">3,100+</span>
        <span class="impact-label">Children Supported</span>
      </article>

      <article class="impact-stat" data-impact-stat>
        <span class="impact-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M3 16h6l3.2-8.2L18 24l3.1-8H29" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="impact-number" data-count="1850">1,850+</span>
        <span class="impact-label">Health Check-ups</span>
      </article>
    </div>
  </div>
</section>
  <script>
    (() => {
      const section = document.querySelector('.impact-section');
      if (!section) return;
      const counters = [...section.querySelectorAll('[data-count]')];
      const format = new Intl.NumberFormat('en-US');
      const finish = () => counters.forEach((counter) => {
        const value = Number(counter.dataset.count);
        counter.textContent = `${format.format(value)}+`;
      });
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
        section.classList.add('is-visible');
        finish();
        return;
      }
      let played = false;
      const observer = new IntersectionObserver((entries) => {
        if (played || !entries.some((entry) => entry.isIntersecting)) return;
        played = true;
        section.classList.add('is-visible');
        const start = performance.now();
        const duration = 1700;
        const animate = (now) => {
          const progress = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          counters.forEach((counter) => {
            const value = Number(counter.dataset.count);
            counter.textContent = `${format.format(Math.round(value * eased))}${progress === 1 ? '+' : ''}`;
          });
          if (progress < 1) requestAnimationFrame(animate);
          else observer.disconnect();
        };
        requestAnimationFrame(animate);
      }, { threshold: 0.28 });
      observer.observe(section);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Direction — Mission and Vision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="our-vision-about.css">
</head>
<body style="margin:0;background:#f9fcf6">
  <main>
    <section class="mjks-direction" aria-labelledby="mjks-direction-label">
      <img class="mjks-direction__hill" src="assets/direction-left-hill.webp" alt="" aria-hidden="true">
      <img class="mjks-direction__hill mjks-direction__hill--right" src="assets/direction-left-hill.webp" alt="" aria-hidden="true">
      <div class="mjks-direction__inner">
        <div class="mjks-direction__eyebrow" id="mjks-direction-label">
          <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="20"/><path d="M32 2v10M32 52v10M2 32h10M52 32h10"/><path d="M32 18l7 14-7 14-7-14 7-14z"/><circle cx="32" cy="32" r="2.3" fill="currentColor" stroke="none"/></g></svg>
          <span>Our Direction</span>
        </div>
        <article class="mjks-direction__content mjks-direction__mission">
          <div class="mjks-direction__heading-row">
            <svg class="mjks-direction__content-icon" viewBox="0 0 72 116" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M36 109V26"/><path d="M36 38C22 37 12 28 11 15c14 0 24 7 25 23z"/><path d="M36 53c14-1 25-10 26-24-14 0-24 8-26 24z"/><path d="M36 72c-13-1-22-9-24-21 13 0 22 7 24 21z"/><path d="M36 92c12-1 21-8 23-19-12 0-21 6-23 19z"/><path d="M27 106l9 8 9-8"/></g></svg>
            <h2 class="mjks-direction__title">Mission</h2>
          </div>
          <p class="mjks-direction__text">To work with communities, understand real needs and turn care into meaningful action.</p>
        </article>
        <picture class="mjks-direction__scene-wrap">
          <source media="(max-width: 767px)" srcset="assets/direction-journey-mobile.webp">
          <img class="mjks-direction__scene" src="assets/direction-journey-approved.webp" alt="" aria-hidden="true">
        </picture>
        <svg class="mjks-direction__curve" viewBox="0 0 1000 320" preserveAspectRatio="none" aria-hidden="true"><path d="M12 78 C170 26 302 28 404 76 C486 128 520 252 604 296 C700 322 806 292 956 142"/></svg>
        <article class="mjks-direction__content mjks-direction__vision">
          <div class="mjks-direction__heading-row">
            <svg class="mjks-direction__content-icon" viewBox="0 0 100 62" aria-hidden="true"><path d="M4 31C16 13 31 5 50 5s34 8 46 26C84 49 69 57 50 57S16 49 4 31z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="31" r="14" fill="var(--gold)" stroke="currentColor" stroke-width="5"/><circle cx="50" cy="31" r="5" fill="currentColor"/></svg>
            <h2 class="mjks-direction__title">Vision</h2>
          </div>
          <p class="mjks-direction__text">A society where every person can live with dignity, opportunity and hope.</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
